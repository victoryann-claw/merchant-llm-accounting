version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: merchant-postgres
    environment:
      POSTGRES_DB: merchant_accounting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: merchant-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: merchant_accounting
      API_PORT: 8080
      QWEN_API_KEY: ${QWEN_API_KEY}
      QWEN_VL_API_KEY: ${QWEN_VL_API_KEY}
      TENCENT_ASR_SECRET_ID: ${TENCENT_ASR_SECRET_ID}
      TENCENT_ASR_SECRET_KEY: ${TENCENT_ASR_SECRET_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
